<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-tr="Bakım Çalışması | Alba Vize" data-en="Under Maintenance | Alba Vize">Bakım Çalışması | Alba Vize</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a0f1e">
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --gold: #bf1a2f;
    --navy: #0a0f1e;
    --off-white: #f7f5f2;
    --muted: rgba(247, 245, 242, 0.55);
    --font-heading: 'Cormorant Garamond', serif;
    --font-body: 'Inter', sans-serif;
  }

  html, body {
    height: 100%;
    font-family: var(--font-body);
    background: var(--navy);
    color: var(--off-white);
    overflow: hidden;
  }

  /* Subtle grain */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
  }

  /* Radial glow */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse 70% 60% at 50% 40%, rgba(191, 26, 47, 0.08) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* Language toggle */
  .lang-toggle {
    position: fixed;
    top: 1.5rem;
    right: 1.75rem;
    z-index: 10;
    display: flex;
    gap: 0.5rem;
    align-items: center;
  }

  .lang-toggle button {
    background: none;
    border: 1px solid rgba(247, 245, 242, 0.2);
    color: var(--muted);
    font-family: var(--font-body);
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 0.3rem 0.65rem;
    border-radius: 2px;
    cursor: pointer;
    transition: all 0.25s ease;
  }

  .lang-toggle button.active,
  .lang-toggle button:hover {
    color: var(--off-white);
    border-color: rgba(247, 245, 242, 0.5);
  }

  /* Logo */
  .logo {
    position: fixed;
    top: 1.5rem;
    left: 1.75rem;
    z-index: 10;
    font-family: var(--font-heading);
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--off-white);
    text-decoration: none;
  }

  .logo span {
    color: var(--gold);
  }

  /* Main layout */
  main {
    position: relative;
    z-index: 1;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem 1.5rem;
  }

  .eyebrow {
    display: inline-block;
    font-size: 0.7rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 1.5rem;
    font-weight: 600;
  }

  h1 {
    font-family: var(--font-heading);
    font-size: clamp(2.6rem, 7vw, 5rem);
    font-weight: 600;
    line-height: 1.1;
    color: var(--off-white);
    margin-bottom: 1.25rem;
    max-width: 16ch;
  }

  h1 em {
    font-style: italic;
    color: rgba(247, 245, 242, 0.7);
  }

  .description {
    font-size: clamp(0.95rem, 2vw, 1.1rem);
    color: var(--muted);
    line-height: 1.7;
    max-width: 440px;
    margin-bottom: 2.75rem;
    font-weight: 300;
  }

  /* Divider */
  .divider {
    width: 40px;
    height: 1px;
    background: var(--gold);
    margin: 0 auto 2.75rem;
    opacity: 0.6;
  }

  /* Contact link */
  .contact-link {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.85rem;
    font-weight: 500;
    letter-spacing: 0.06em;
    color: var(--off-white);
    border: 1px solid rgba(247, 245, 242, 0.25);
    padding: 0.75rem 1.5rem;
    border-radius: 2px;
    text-decoration: none;
    transition: border-color 0.25s ease, color 0.25s ease;
  }

  .contact-link:hover {
    border-color: rgba(247, 245, 242, 0.6);
    color: #fff;
  }

  .contact-link svg {
    opacity: 0.6;
  }

  /* Footer note */
  .footer-note {
    position: fixed;
    bottom: 1.5rem;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 0.72rem;
    color: rgba(247, 245, 242, 0.25);
    letter-spacing: 0.06em;
    z-index: 10;
  }
</style>
</head>
<body>

<a class="logo" href="/">Alba <span>Vize</span></a>

<div class="lang-toggle" role="group" aria-label="Dil seçimi / Language">
  <button id="btn-tr" class="active" onclick="setLang('tr')">TR</button>
  <button id="btn-en" onclick="setLang('en')">EN</button>
</div>

<main>
  <span class="eyebrow" data-tr="Çalışmaya Devam Ediyoruz" data-en="We'll Be Right Back">Çalışmaya Devam Ediyoruz</span>

  <h1>
    <span data-tr="Site şu an <em>bakımda</em>" data-en="Site is currently <em>under maintenance</em>">Site şu an <em>bakımda</em></span>
  </h1>

  <div class="divider"></div>

  <p class="description"
     data-tr="Sizlere daha iyi hizmet sunabilmek için sitemizi güncelliyoruz. Kısa süre içinde tekrar erişilebilir olacaktır."
     data-en="We're making improvements to serve you better. The site will be back up shortly.">
    Sizlere daha iyi hizmet sunabilmek için sitemizi güncelliyoruz. Kısa süre içinde tekrar erişilebilir olacaktır.
  </p>

  <a class="contact-link" href="mailto:info@albavize.com">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 7l10 7 10-7"/></svg>
    <span data-tr="Bize ulaşın" data-en="Contact us">Bize ulaşın</span>
  </a>
</main>

<p class="footer-note">© 2026 Alba Vize</p>

<script>
  function setLang(lang) {
    document.documentElement.lang = lang;

    // Update all elements with data-tr / data-en attributes
    document.querySelectorAll('[data-tr],[data-en]').forEach(el => {
      const val = el.getAttribute('data-' + lang);
      if (val !== null) el.innerHTML = val;
    });

    // Update page title
    const titleEl = document.querySelector('title');
    const titleVal = titleEl && titleEl.getAttribute('data-' + lang);
    if (titleVal) titleEl.textContent = titleVal;

    // Toggle button states
    document.getElementById('btn-tr').classList.toggle('active', lang === 'tr');
    document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  }

  // Auto-detect browser language on load
  (function () {
    const browserLang = navigator.language || navigator.userLanguage || 'tr';
    if (browserLang.toLowerCase().startsWith('tr')) return; // TR is default
    setLang('en');
  })();
</script>
</body>
</html>
