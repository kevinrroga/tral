<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #f7f5f2;
    font-family: 'Cormorant Garamond', Georgia, serif;
  }

  /* dot grid background */
  .bg-dots {
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle, rgba(191,26,47,0.18) 1.5px, transparent 1.5px);
    background-size: 36px 36px;
  }

  /* warm vignette */
  .bg-vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 40%, transparent 40%, rgba(191,26,47,0.06) 100%);
  }

  /* red top accent bar */
  .top-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 5px;
    background: #bf1a2f;
  }

  /* main content */
  .content {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 80px 120px;
    text-align: center;
    gap: 20px;
  }

  .label {
    font-family: 'Inter', Arial, sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #bf1a2f;
  }

  .title {
    font-size: 72px;
    font-weight: 600;
    color: #1a1a1a;
    line-height: 1.1;
    letter-spacing: -0.01em;
  }

  .title em {
    font-style: italic;
    color: #bf1a2f;
  }

  .divider {
    width: 48px;
    height: 1px;
    background: rgba(191,26,47,0.4);
  }

  .tagline {
    font-family: 'Inter', Arial, sans-serif;
    font-size: 18px;
    font-weight: 300;
    color: rgba(26,26,26,0.6);
    letter-spacing: 0.02em;
    max-width: 560px;
    line-height: 1.6;
  }

  /* skyline */
  .skyline-wrap {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 200px;
  }

  .skyline-back {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 100%;
    color: rgba(191,26,47,0.12);
  }

  .skyline-front {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 100%;
    color: rgba(191,26,47,0.22);
  }

  /* flags row */
  .flags {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .flag {
    width: 44px;
    height: 30px;
    border-radius: 4px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    flex-shrink: 0;
  }

  .arrow {
    font-family: 'Inter', Arial, sans-serif;
    font-size: 18px;
    color: rgba(26,26,26,0.3);
    line-height: 1;
  }

  /* corner badge */
  .badge {
    position: absolute;
    bottom: 32px;
    right: 48px;
    font-family: 'Inter', Arial, sans-serif;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(26,26,26,0.35);
  }

  .badge span {
    color: #bf1a2f;
  }
</style>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Inter:wght@300;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="bg-dots"></div>
<div class="bg-vignette"></div>
<div class="top-bar"></div>

<div class="content">
  <div class="label">Arnavutluk Danışmanlık</div>
  <div class="title">Yeni Bir<br><em>Başlangıç</em></div>
  <div class="divider"></div>
  <div class="tagline">Oturma izni, çalışma izni ve yerleşim süreçlerinizde Türkçe destek.</div>

  <div class="flags">
    <img class="flag" src="https://flagcdn.com/w80/tr.png" alt="Türkiye">
    <div class="arrow">→</div>
    <img class="flag" src="https://flagcdn.com/w80/al.png" alt="Arnavutluk">
  </div>
</div>

</div>

<div class="badge">Türkçe Destek &nbsp;<span>·</span>&nbsp; Tiran, Arnavutluk</div>

</body>
</html>
